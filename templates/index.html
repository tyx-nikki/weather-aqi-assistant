<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市天气与空气质量出行助手</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><header><p class="eyebrow">数据采集与集成课程项目</p><h1>城市天气与空气质量出行助手</h1><p>把同一城市、同一小时的两类预测放在一起，帮助选择出行时段。</p></header>
<section class="panel"><h2>查询出行时段</h2><div class="nl"><label for="sentence">自然语言输入</label><div class="inline"><input id="sentence" placeholder="例如：明天下午在上海跑步"><button id="parse-rule">规则解析</button><button id="parse-model" {% if not model_available %}disabled title="需配置模型接口"{% endif %}>AI 解析</button></div><small id="parse-status">AI 解析需在服务端配置模型接口；表单查询和规则解析可直接使用。</small></div>
<div class="grid"><label>城市<input id="city" value="上海" autocomplete="off"></label><label>日期<input id="date" type="date"></label><label>时段<select id="period"><option>上午</option><option selected>下午</option><option>晚上</option><option>全天</option></select></label><label>活动<select id="activity"><option>通勤</option><option>步行</option><option selected>跑步</option><option>骑行</option></select></label></div><button id="search" class="primary">查询预测</button><div id="city-choice" hidden></div><p id="status" role="status"></p></section>
<section id="results" hidden><div class="panel"><h2>逐小时预测</h2><p id="meta"></p><p class="note">以下为模型预测，非现场观测。European AQI 与中国 AQI 口径不同。提示阈值为项目演示规则。</p><div id="summary"></div><div class="chart"><canvas id="chart" width="900" height="260" aria-label="气温和 PM2.5 逐小时趋势"></canvas></div><div class="table-wrap"><table><thead><tr><th>当地时间</th><th>气温 °C</th><th>降水 %</th><th>风速 km/h</th><th>PM2.5 µg/m³</th><th>European AQI</th><th>提示及依据</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<footer>数据来源：<a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Open-Meteo 天气预报</a> · <a href="https://open-meteo.com/en/docs/air-quality-api" target="_blank" rel="noopener">空气质量预报</a></footer></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
